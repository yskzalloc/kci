name: KCI Tests

on:
  push:
    branches: [ksmbd-for-next-next]
  pull_request:
  schedule:
    - cron: '0 12 * * *'

jobs:
  # One parallel leg per sanitizer, each using the syzbot instance config
  # tuned for that sanitizer (flipping KMSAN on in the generic KASAN
  # config does not link: "kernel image bigger than KERNEL_IMAGE_SIZE").
  # KFENCE: off next to full KASAN coverage, on for kcsan/kmsan legs.
  ksmbd-xfstests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: kasan
            config: syzkaller
            configitems: >-
              -C CONFIG_KFENCE=n
            config_check: CONFIG_KASAN=y
          - sanitizer: kcsan
            config: syzkaller-kcsan
            configitems: >-
              -C CONFIG_KCSAN_EARLY_ENABLE=y
              -C CONFIG_KFENCE=y
            config_check: CONFIG_KCSAN=y
          - sanitizer: kmsan
            config: syzkaller-kmsan
            configitems: >-
              -C CONFIG_KFENCE=y
            config_check: CONFIG_KMSAN=y
    name: ksmbd-xfstests (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: everything below (toolchains, clones,
      # sanitizer kernel build, xfstests exports) shares this filesystem,
      # and a KASAN/KMSAN build with debug info alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install kci
        run: pip install -e .

      - name: kci init
        run: kci init

      - name: Install ksmbd-tools and xfstests build deps
        run: |
          sudo apt install -y -qq cifs-utils attr quota fio dbench \
            autoconf automake libtool libtool-bin pkg-config gawk sqlite3 \
            libnl-3-dev libnl-genl-3-dev libglib2.0-dev \
            xfslibs-dev xfsprogs e2fsprogs uuid-dev uuid-runtime \
            libattr1-dev libacl1-dev libaio-dev libgdbm-dev libgdbm-compat-dev liburing-dev

      # Latest LLVM snapshot from apt.llvm.org (llvm-toolchain-noble = trunk);
      # packages are versioned (clang-N), so prepend /usr/lib/llvm-N/bin to
      # PATH where the unversioned clang/ld.lld/llvm-* live, for LLVM=1 builds.
      - name: Install latest LLVM toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm-org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble main" | sudo tee /etc/apt/sources.list.d/apt-llvm-org.list
          echo "deb-src http://apt.llvm.org/noble/ llvm-toolchain-noble main" | sudo tee -a /etc/apt/sources.list.d/apt-llvm-org.list
          sudo apt-get update -qq
          # kmsan leg: trunk snapshots can regress -fsanitize=kernel-memory,
          # which makes Kconfig drop HAVE_KMSAN_COMPILER (and thus KMSAN)
          # silently; walk down from the newest clang until the probe passes.
          PROBE=""
          [ "${{ matrix.sanitizer }}" = "kmsan" ] && PROBE="-fsanitize=kernel-memory"
          for LLVM_VER in $(apt-cache search --names-only '^clang-[0-9]+$' | awk -F'[- ]' '{print $2}' | sort -rn); do
            sudo apt-get install -y -qq clang-$LLVM_VER lld-$LLVM_VER llvm-$LLVM_VER
            if [ -z "$PROBE" ] || /usr/lib/llvm-$LLVM_VER/bin/clang -Werror $PROBE -S -x c /dev/null -o /dev/null 2>/dev/null; then
              break
            fi
            echo "clang-$LLVM_VER lacks $PROBE support, trying older"
          done
          echo "/usr/lib/llvm-$LLVM_VER/bin" >> $GITHUB_PATH
          /usr/lib/llvm-$LLVM_VER/bin/clang --version

      - name: Checkout ksmbd-tools
        uses: actions/checkout@v4
        with:
          repository: cifsd-team/ksmbd-tools
          path: ksmbd-tools

      - name: Build and install ksmbd-tools
        run: |
          cd ksmbd-tools
          ./autogen.sh
          ./configure --sysconfdir=/etc --with-rundir=/run
          make CC=clang -j`nproc`
          sudo make install

      # xfstests is hosted on git.kernel.org; actions/checkout can only
      # fetch GitHub repositories, so plain git clone stays here.
      - name: Build xfstests
        run: |
          git clone --depth 1 https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git
          make -j`nproc` -C xfstests-dev

      - name: Checkout ksmbd kernel
        uses: actions/checkout@v4
        with:
          repository: smfrench/smb3-kernel
          ref: ksmbd-for-next-next
          path: smb3-kernel

      - name: kci build
        run: |
          source $HOME/venv-virtme/bin/activate
          clang --version | head -1
          kci build -k smb3-kernel -t filesystems \
            -c ${{ matrix.config }} \
            -C CONFIG_KUNIT=n \
            -C CONFIG_CIFS=y \
            -C CONFIG_CIFS_XATTR=y \
            -C CONFIG_CIFS_POSIX=y \
            -C CONFIG_CIFS_ALLOW_INSECURE_LEGACY=y \
            -C CONFIG_CIFS_DEBUG=y \
            -C CONFIG_SMB_SERVER=y \
            -C CONFIG_SMB_SERVER_CHECK_CAP_NET_ADMIN=y \
            ${{ matrix.configitems }} \
            LLVM=1

      # olddefconfig drops sanitizer options whose dependencies are unmet;
      # fail loudly instead of silently testing an unsanitized kernel,
      # and dump the dependency state so the cause is visible in the log.
      - name: Verify ${{ matrix.sanitizer }} is enabled
        run: |
          grep -x "${{ matrix.config_check }}" smb3-kernel/.config && exit 0
          echo "::error::${{ matrix.sanitizer }} was dropped by olddefconfig; dependency state:"
          grep -E "CONFIG_(CC_IS_CLANG|CC_VERSION_TEXT|HAVE_ARCH_KMSAN|HAVE_KMSAN_COMPILER|HAVE_ARCH_KCSAN|HAVE_KCSAN_COMPILER|DEBUG_KERNEL|PREEMPT_RT|KASAN|KCSAN|KMSAN|KFENCE)[= ]" smb3-kernel/.config || true
          exit 1

      - name: kci run ksmbd
        run: |
          source $HOME/venv-virtme/bin/activate
          export KCI_XFSTESTS_DIR=$GITHUB_WORKSPACE/xfstests-dev
          kci run -k smb3-kernel ksmbd

      - name: Show results
        if: always()
        run: |
          echo "=== XFSTESTS SUMMARY ==="
          grep -E "^(Failures:|Failed [0-9]+ of|Passed all|Not run:)" smb3-kernel/test-results/xfstests-ksmbd.txt 2>/dev/null || echo "(no summary)"
          echo ""
          echo "=== KERNEL DMESG BUGS ==="
          grep -E "(BUG:|KASAN:|KCSAN:|KMSAN:|UBSAN:|Oops:|WARNING:)" smb3-kernel/test-results/dmesg.txt 2>/dev/null || echo "(none)"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksmbd-test-results-${{ matrix.sanitizer }}
          path: smb3-kernel/test-results/

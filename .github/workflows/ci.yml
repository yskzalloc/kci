name: KCI Tests

on:
  push:
    branches: [dept]
  pull_request:
  schedule:
    - cron: '0 17 * * *'

jobs:
  # One parallel leg per sanitizer, each using the syzbot instance config
  # tuned for that sanitizer (flipping KMSAN on in the generic KASAN
  # config does not link: "kernel image bigger than KERNEL_IMAGE_SIZE").
  # KFENCE: off next to full KASAN coverage, on for kcsan/kmsan legs.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: kasan
            config: syzkaller
            configitems: >-
              -C CONFIG_KFENCE=n
            config_check: CONFIG_KASAN=y
          - sanitizer: kcsan
            config: syzkaller-kcsan
            configitems: >-
              -C CONFIG_KCSAN_EARLY_ENABLE=y
              -C CONFIG_KFENCE=y
            config_check: CONFIG_KCSAN=y
          # KMSAN is the slowest leg; if it starts exhausting the 6h job
          # limit, comment it out like the xfstests pipeline does.
          - sanitizer: kmsan
            config: syzkaller-kmsan
            configitems: >-
              -C CONFIG_KFENCE=y
            config_check: CONFIG_KMSAN=y
          # RT legs: same sanitizer configs with the locking layer swapped
          # to the PREEMPT_RT variants (EXPERT=y unlocks the RT prompt).
          - sanitizer: kasan-rt
            config: syzkaller
            configitems: >-
              -C CONFIG_KFENCE=n
              -C CONFIG_EXPERT=y
              -C CONFIG_PREEMPT_RT=y
            config_check: CONFIG_KASAN=y CONFIG_PREEMPT_RT=y
          - sanitizer: kcsan-rt
            config: syzkaller-kcsan
            configitems: >-
              -C CONFIG_KCSAN_EARLY_ENABLE=y
              -C CONFIG_KFENCE=y
              -C CONFIG_EXPERT=y
              -C CONFIG_PREEMPT_RT=y
            config_check: CONFIG_KCSAN=y CONFIG_PREEMPT_RT=y
    name: test (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # First thing after checkout: a KASAN/KMSAN build with debug info
      # alone can eat 15-25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install kci
        run: pip install -e .

      - name: kci init
        run: kci init

      - name: Clone DEPT kernel
        run: git clone -b dept19_v7.0 --depth 1 https://github.com/maxbyungchulpark/linux-dept.git ~/linux

      # CONFIG_DEPT (lib/Kconfig.debug) selects everything else it needs
      # (PROVE_LOCKING, DEBUG_SPINLOCK/MUTEXES/RWSEMS, TRACE_IRQFLAGS, ...);
      # -R makes kci fail fast if olddefconfig drops it.
      - name: kci build
        run: |
          source $HOME/venv-virtme/bin/activate
          REQUIRE=""
          for c in ${{ matrix.config_check }} CONFIG_DEPT=y; do
            REQUIRE="$REQUIRE -R $c"
          done
          kci build -k ~/linux \
            -c ${{ matrix.config }} \
            $REQUIRE \
            -C CONFIG_DEPT=y \
            -C CONFIG_DEPT_AGGRESSIVE_TIMEOUT_WAIT=y \
            -C CONFIG_DEPT_UNIT_TEST=m \
            ${{ matrix.configitems }} \
            LLVM=1

      # olddefconfig drops options whose dependencies are unmet; fail loudly
      # instead of silently testing an unsanitized or DEPT-less kernel, and
      # dump the dependency state so the cause is visible in the log.
      - name: Verify ${{ matrix.sanitizer }} and DEPT are enabled
        run: |
          missing=0
          for c in ${{ matrix.config_check }} CONFIG_DEPT=y; do
            grep -x "$c" ~/linux/.config || { echo "::error::$c was dropped by olddefconfig"; missing=1; }
          done
          [ $missing -eq 0 ] && exit 0
          echo "dependency state:"
          grep -E "CONFIG_(CC_IS_CLANG|CC_VERSION_TEXT|HAVE_ARCH_KMSAN|HAVE_KMSAN_COMPILER|HAVE_ARCH_KCSAN|HAVE_KCSAN_COMPILER|DEBUG_KERNEL|EXPERT|ARCH_SUPPORTS_RT|PREEMPT_RT|KASAN|KCSAN|KMSAN|KFENCE|LOCK_DEBUGGING_SUPPORT|TRACE_IRQFLAGS_SUPPORT|STACKTRACE_SUPPORT|LOCKDEP_SUPPORT|PROVE_LOCKING|DEPT)[= ]" ~/linux/.config || true
          exit 1

      - name: kci run
        run: |
          source $HOME/venv-virtme/bin/activate
          kci run -k ~/linux

      - name: kci report
        if: always()
        run: |
          source $HOME/venv-virtme/bin/activate
          kci report -k ~/linux

      - name: Show detailed results
        if: always()
        run: |
          echo "=== REPORT ==="
          cat /tmp/kci-report.md
          echo ""
          echo "=== KUNIT FAILURES ==="
          grep "not ok" ~/linux/test-results/kunit.txt 2>/dev/null || echo "(none)"
          echo ""
          echo "=== KSELFTEST ALL FAILURES ==="
          grep "^not ok" ~/linux/test-results/kselftest.txt 2>/dev/null || echo "(none)"
          echo ""
          echo "=== KSELFTEST SUMMARY (per suite) ==="
          grep "# Totals" ~/linux/test-results/kselftest.txt 2>/dev/null || echo "(none)"
          echo ""
          echo "=== KVM-UNIT-TESTS FAILURES ==="
          grep "^FAIL" ~/linux/test-results/kvm-unit-tests.txt 2>/dev/null || echo "(none)"
          echo ""
          echo "=== STRESS-NG BUGS ==="
          grep -E "(BUG:|KASAN:|KCSAN:|KMSAN:|UBSAN:|Oops:|DEPT:)" ~/linux/test-results/stress-ng.txt 2>/dev/null || echo "(none)"
          echo ""
          echo "=== KERNEL DMESG BUGS ==="
          grep -E "(BUG:|KASAN:|KCSAN:|KMSAN:|UBSAN:|Oops:|WARNING:|DEPT:|INFO: task|INFO: rcu)" ~/linux/test-results/dmesg.txt 2>/dev/null || echo "(none)"
          echo ""
          echo "=== DEPT REPORTS ==="
          grep -B2 -A40 "DEPT: Circular dependency has been detected" ~/linux/test-results/*.txt 2>/dev/null || echo "(none)"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.sanitizer }}
          path: |
            ~/linux/test-results/
            /tmp/kci-report.md
            /tmp/kci-report.json
